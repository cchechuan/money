<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>專業競標系統 - 多人決標大螢幕端</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; overflow: hidden; }
        .header { padding: 15px; background: #c0392b; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .price-tag { font-size: 90px; color: #f1c40f; margin: 5px 0; font-weight: bold; text-shadow: 0 0 30px rgba(241, 196, 15, 0.8); }
        .winner-announcement { display: none; font-size: 50px; color: #2ecc71; animation: celebrate 0.5s infinite alternate; z-index: 100; position: relative; }
        @keyframes celebrate { from { transform: scale(1); } to { transform: scale(1.05); } }
        
        .main-layout { display: flex; justify-content: space-around; padding: 10px 40px; height: 60vh; align-items: center; }
        #qrcode-container { background: white; padding: 15px; border-radius: 15px; width: 180px; }
        
        /* 排行榜優化為可容納 10 名 */
        #leaderboard { width: 55%; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; height: 90%; overflow-y: auto; }
        .bid-row { display: flex; justify-content: space-between; font-size: 24px; padding: 8px 15px; border-bottom: 1px solid #333; align-items: center; }
        .rank-win { background: #f1c40f; color: black; border-radius: 10px; font-weight: bold; }

        .admin-panel { position: fixed; bottom: 0; width: 100%; background: #333; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 12px; border-top: 2px solid #444; flex-wrap: wrap; }
        input { padding: 8px; font-size: 16px; width: 90px; border-radius: 5px; border: none; text-align: center; font-weight: bold; }
        .admin-btn { padding: 10px 18px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .btn-mute { background: #7f8c8d; }
        .btn-new { background: #3498db; }
        .btn-end { background: #e74c3c; }
        .is-muted { background: #c0392b !important; text-decoration: line-through; }
    </style>
</head>
<body onclick="initAudio()">

<audio id="bgm" loop preload="auto"><source src="https://actions.google.com/音效/music/electronic_rock.mp3" type="audio/mpeg"></audio>
<audio id="cheer" preload="auto"><source src="https://actions.google.com/音效/human/cheer_large_crowd.mp3" type="audio/mpeg"></audio>

<div class="header"><h1>現場即時競標 (多得標者模式)</h1></div>

<div style="margin-top:10px;">
    <div id="statusText" style="font-size: 22px; color: #bdc3c7;">目前最高出價</div>
    <div class="price-tag" id="mainPrice">$0</div>
    <div id="mainUser" style="font-size: 32px; color: #f1c40f;">等待出價中...</div>
    <div id="winnerMsg" class="winner-announcement">🎊 恭喜以上得標者！ 🎊</div>
</div>

<div class="main-layout">
    <div id="qrcode-container">
        <div id="qrcode"></div>
        <p style="color: black; margin: 10px 0 5px 0; font-weight: bold; font-size: 14px;">掃碼參與競標</p>
        <div id="startPriceDisplay" style="color: #c0392b; font-size: 18px; font-weight: bold;">起標價: $0</div>
    </div>
    <div id="leaderboard"><div id="list"></div></div>
</div>

<div class="admin-panel">
    <button id="muteBtn" class="admin-btn btn-mute" onclick="toggleMute()">🔊 音樂開啟</button>
    <span>| 起標價：$</span>
    <input type="number" id="basePriceInput" value="0">
    <span>| 得標人數：</span>
    <input type="number" id="winnerCountInput" value="1" min="1"> <button class="admin-btn btn-new" onclick="startNewAuction()">🔄 開始新競標</button>
    <button class="admin-btn btn-end" onclick="finishAuction()">🔨 決標 (成交)</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBLKKHyGT1MHJqMq8q8tjJTBNTaIc7EKBs",
        authDomain: "money0115.firebaseapp.com",
        databaseURL: "https://money0115-default-rtdb.firebaseio.com",
        projectId: "money0115",
        storageBucket: "money0115.firebasestorage.app",
        messagingSenderId: "486161681478",
        appId: "1:486161681478:web:ea1107c2c5c8ebe6a5ce47",
        measurementId: "G-WT1BGS47KH"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('auction_live');

    let isMuted = false;
    let audioInitialized = false;

    function initAudio() {
        if (audioInitialized) return;
        const bgm = document.getElementById('bgm');
        const cheer = document.getElementById('cheer');
        bgm.play().then(() => { bgm.pause(); cheer.play(); cheer.pause(); audioInitialized = true; })
        .catch(e => console.log("等待手動解鎖音效"));
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = document.getElementById('muteBtn');
        const bgm = document.getElementById('bgm');
        if (isMuted) {
            btn.innerText = "🔇 音樂靜音"; btn.classList.add('is-muted'); bgm.pause();
        } else {
            btn.innerText = "🔊 音樂開啟"; btn.classList.remove('is-muted');
            db.child('status').once('value', s => { if(s.val() === 'open') bgm.play(); });
        }
    }

    function launchFireworks() {
        var duration = 5 * 1000;
        var animationEnd = Date.now() + duration;
        var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            confetti({ particleCount: 50, spread: 90, origin: { x: 0.1, y: 0.8 }, zIndex: 999 });
            confetti({ particleCount: 50, spread: 90, origin: { x: 0.9, y: 0.8 }, zIndex: 999 });
        }, 300);
    }

    db.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const bids = data.bids || {};
        const status = data.status || 'open';
        const limitWinners = data.winnerCount || 1;

        // 核心排序邏輯修正：金額高到低 -> 金額相同比時間（時間戳記小優先）
        const sorted = Object.entries(bids).sort((a, b) => {
            if (b[1].amount !== a[1].amount) {
                return b[1].amount - a[1].amount; // 金額大優先
            }
            return a[1].time - b[1].time; // 時間早優先
        });

        document.getElementById('startPriceDisplay').innerText = "起標價: $" + (data.startPrice || 0);
        document.getElementById('winnerCountInput').value = limitWinners;

        if (status === 'closed') {
            document.getElementById('winnerMsg').style.display = 'block';
            document.getElementById('bgm').pause();
            if (!isMuted && audioInitialized) document.getElementById('cheer').play();
        } else {
            document.getElementById('winnerMsg').style.display = 'none';
        }

        if (sorted.length > 0) {
            document.getElementById('mainPrice').innerText = "$" + sorted[0][1].amount;
            document.getElementById('mainUser').innerText = "最高領先者: " + sorted[0][0];
            if (status === 'open' && !isMuted && audioInitialized) document.getElementById('bgm').play();
        } else {
            document.getElementById('mainPrice').innerText = "$0";
            document.getElementById('mainUser').innerText = "等待出價中...";
        }

        // 渲染前 10 名排行榜
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = sorted.slice(0, 10).map((item, index) => {
            // 只要名次在設定的決標人數內，就套用黃色得標樣式
            const isWinningNow = index < limitWinners;
            return `
                <div class="bid-row ${isWinningNow ? 'rank-win' : ''}">
                    <span>${index + 1}. ${item[0]} ${isWinningNow ? '👑 (準得標)' : ''}</span>
                    <span>$${item[1].amount}</span>
                </div>
            `;
        }).join('');
    });

    const currentUrl = window.location.href.split('?')[0].split('#')[0];
    const phoneUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + "/bid.html";
    new QRCode(document.getElementById("qrcode"), { text: phoneUrl, width: 180, height: 180 });

    function startNewAuction() {
        initAudio();
        const price = parseInt(document.getElementById('basePriceInput').value) || 0;
        const wCount = parseInt(document.getElementById('winnerCountInput').value) || 1;
        if(confirm(`確定重啟競標？\n起標價：$${price}\n得標人數設定：${wCount} 人`)) {
            db.set({ status: 'open', bids: {}, startPrice: price, winnerCount: wCount });
            const bgm = document.getElementById('bgm');
            bgm.currentTime = 0;
            if(!isMuted && audioInitialized) bgm.play();
        }
    }

    function finishAuction() {
        if(confirm("確定要決標成交嗎？")) {
            db.child('status').set('closed');
            launchFireworks();
        }
    }
</script>
</body>
</html>
